<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymSync</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,800;0,900;1,400;1,800&family=Bebas+Neue&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="logo">GYM<span>SYNC</span></h1>
            <button class="openConfirmReset" aria-label="Reset Workout">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </header>

        <section class="controls">
            <select id="workoutDay" class="day-selector" aria-label="Select Workout Day">
                <option value="0">Push Day</option>
                <option value="1">Pull Day</option>
                <option value="2">Legs Day</option>
                <option value="3">Testing Day</option>
            </select>
        </section>

        <main>
            <div class="workout-card">
                <div class="workout-header">
                    <button class="icon-btn backWorkout" aria-label="Previous Workout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <div class="workout-info-top">
                        <span class="workoutStatusTxt">Current Workout</span>
                        <h2 class="curWorkout">Bench Press 1</h2>
                    </div>
                    <button class="icon-btn skipWorkout" aria-label="Next Workout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
                
                <div class="workout-details">
                    <p class="curWorkoutDesc">"Full range, pec focus, 1-2 RIR"</p>
                    <div class="rep-badge">
                        <span class="curWorkoutReps">3 x 6-10</span>
                    </div>
                </div>
            </div>

            <div class="timer-section">
                <div class="timer-circle">
                    <p class="workRestStatus">READY</p>
                    <p class="restTime">0</p>
                </div>
            </div>

            <div class="action-section">
                <button class="cut primary-btn">START WORKOUT</button>
            </div>
        </main>
        
        <div class="overlay hidden"></div>
        <div class="confirmReset hidden">
            <h2>Reset Session?</h2>
            <p>This will reset all your progress for the current workout session.</p>
            <div class="modal-actions">
                <button class="close-modal btn-secondary">Cancel</button>
                <button class="reset btn-danger">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
